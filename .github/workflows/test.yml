name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: ./build.sh test

  e2e:
    runs-on: ubuntu-24.04
    env:
      APPSERVICE_REF: 1667a011ad9693ac3f968ce6e00450fb670d015c  # appservice 1.1.0, whose API this client speaks; its examples run that image
      COMPOSE_IMAGE: docker.io/library/docker@sha256:48678dab48932d2b9189040748f321d4eb09c90193bbf4f4b9b86d72cffd6e25  # Compose pinned, not the runner's
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: matrix-for-ai/appservice
          ref: ${{ env.APPSERVICE_REF }}
          path: appservice
      - name: Start homeserver and appservice
        working-directory: appservice/examples
        run: |
          compose() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$COMPOSE_IMAGE" docker compose "$@"; }
          for name in MATRIX_AS_TOKEN MATRIX_HS_TOKEN AI_API_ADMIN_TOKEN; do
            echo "$name=$(openssl rand -hex 32)"
          done > .env
          compose up -d --build
          for _ in $(seq 60); do
            curl -fsS localhost:7700/capabilities && exit 0
            sleep 2
          done
          compose logs
          exit 1
      - run: ./build.sh e2e http://127.0.0.1:7700
      - name: Logs
        if: failure()
        working-directory: appservice/examples
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" "$COMPOSE_IMAGE" docker compose logs

  passed:
    if: always()
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test -z "$(echo "$RESULTS" | tr ' ' '\n' | grep -vx success)"
