name: release

# A merged release PR puts a new version on master: tag it and publish its binaries.
# build runs the repo's code with read-only rights; publish has the write rights and runs none of it.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/matrix-for-ai-cli/main.go)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "new=false"; else echo "new=true"; fi >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.version.outputs.new == 'true'
        run: |
          ./build.sh
          git log -1 --format=%b > notes.md
      - if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/matrix-for-ai-cli-*
            dist/SHA256SUMS
            dist/install.sh
      - run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
